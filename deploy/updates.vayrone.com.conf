# updates.vayrone.com → GitHub releases of the public download repo (binaries only, no source).
# Every installed PostMaster checks https://updates.vayrone.com/postmaster/<channel>/<target>/latest.vidx
# and downloads the package next to it; both are redirected to the GitHub release files.
# The index and the packages are signed, so the redirect needs no trust of its own.
# Installed on the aaPanel VM as /www/server/panel/vhost/nginx/updates.vayrone.com.conf.
server {
    listen 80;
    server_name updates.vayrone.com;
    location /.well-known/acme-challenge/ { root /www/wwwroot/updates.vayrone.com; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name updates.vayrone.com;
    ssl_certificate     /www/server/panel/vhost/cert/updates.vayrone.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/updates.vayrone.com/privkey.pem;

    set $dl https://github.com/akhiljha079/vayrone-postmaster-releases/releases;

    # Latest stable release, per target (win-x64, linux-x64, linux-arm64).
    location ~ ^/postmaster/stable/([a-z0-9-]+)/latest\.vidx$ {
        return 302 $dl/latest/download/latest-$1.vidx;
    }
    # Package names carry their version: vayrone-postmaster-1.0.3-win-x64.vpmupdate
    location ~ ^/postmaster/stable/[a-z0-9-]+/(vayrone-postmaster-([0-9][0-9.]*)-[a-z0-9-]+\.vpmupdate)$ {
        return 302 $dl/download/v$2/$1;
    }
    # No beta channel yet: 404 means "no update" to PostMaster.
    location /postmaster/ { return 404; }
    location = / { return 302 $dl/latest; }
    location / { return 404; }
}
